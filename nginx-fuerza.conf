server {
    server_name fuerzaparaseguir.com www.fuerzaparaseguir.com;

    root /var/www/fuerza-para-seguir/dist;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3006/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/fuerza-para-seguir/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/fuerzaparaseguir.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fuerzaparaseguir.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.fuerzaparaseguir.com) {
        return 301 https://$host$request_uri;
    }

    if ($host = fuerzaparaseguir.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name fuerzaparaseguir.com www.fuerzaparaseguir.com;
    return 404;
}
