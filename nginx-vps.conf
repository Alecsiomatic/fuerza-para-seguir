server {
    listen 80;
    server_name fuerzaparaseguir.com www.fuerzaparaseguir.com;

    root /var/www/fuerza-para-seguir/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3006/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Servir archivos estáticos de las carpetas de sucursales (solo archivos con extensión)
    location ~ ^/(valles|sucursal1|assets)/.*\.(jpg|jpeg|png|gif|svg|ico|webp|mp4|pdf)$ {
        try_files $uri =404;
    }

    # Todas las demás rutas van a React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
    }
}
